
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: strict-dsa-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: YOUR_DOMAIN_HERE
      http:
        paths:
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: strict-dsa-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: strict-dsa-frontend
                port:
                  number: 80
